spring:
  datasource:
    url: jdbc:h2:mem:ai;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: PUBLIC
  flyway:
    enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  cloud:
    discovery:
      enabled: false
eureka:
  client:
    enabled: false
app:
  ai:
    mode: demo
