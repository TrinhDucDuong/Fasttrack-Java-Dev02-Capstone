server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: learning-service
          uri: lb://learning-service
          predicates:
            - Path=/api/auth/**,/api/courses/**,/api/units/**,/api/quizzes/**,/api/progress/**
        - id: ai-service
          uri: lb://ai-service
          predicates:
            - Path=/api/materials/**,/api/conversations/**,/api/ai/**

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
