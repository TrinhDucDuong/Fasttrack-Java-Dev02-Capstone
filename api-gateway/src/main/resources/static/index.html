<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10213a">
  <title>Middle Java AI Study Coach</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #f3f6fb; color: #14243a; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 680px); padding: 40px; border: 1px solid #dce4ef; border-radius: 20px; background: white; box-shadow: 0 24px 70px #10213a12; }
    .eyebrow { color: #52719a; font-size: .78rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 14px 0 12px; font-size: clamp(2rem, 7vw, 3.2rem); line-height: 1.05; }
    p { color: #53647a; line-height: 1.65; }
    .status { display: flex; align-items: center; gap: 12px; margin: 28px 0; padding: 16px; border-radius: 12px; background: #f3f8f5; }
    .dot { width: 11px; height: 11px; border-radius: 50%; background: #91a0b3; }
    .dot.online { background: #168454; box-shadow: 0 0 0 5px #16845418; }
    .status strong { display: block; }
    .status span:last-child { color: #617286; font-size: .9rem; }
    a { color: #1659a8; font-weight: 650; }
    code { padding: 3px 6px; border-radius: 5px; background: #f0f3f8; }
    footer { margin-top: 28px; color: #8090a3; font-size: .82rem; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">FastTrack Java · Capstone</div>
    <h1>AI Study Coach</h1>
    <p>Course learning, progress tracking, quizzes, and grounded AI assistance are available through this service.</p>
    <div class="status" role="status" aria-live="polite">
      <span class="dot" id="health-dot"></span>
      <div><strong id="health-title">Checking service health</strong><span id="health-detail">Connecting to the API gateway</span></div>
    </div>
    <p>Health endpoint: <a href="/actuator/health"><code>/actuator/health</code></a></p>
    <footer>Middle Java AI Study Coach · API Gateway</footer>
  </main>
  <script>
    fetch('/actuator/health', { headers: { Accept: 'application/json' } })
      .then(response => response.ok ? response.json() : Promise.reject())
      .then(data => {
        const online = data.status === 'UP';
        document.getElementById('health-dot').classList.toggle('online', online);
        document.getElementById('health-title').textContent = online ? 'Service online' : 'Service needs attention';
        document.getElementById('health-detail').textContent = `Gateway health: ${data.status}`;
      })
      .catch(() => {
        document.getElementById('health-title').textContent = 'Service unavailable';
        document.getElementById('health-detail').textContent = 'The API gateway health endpoint did not respond';
      });
  </script>
</body>
</html>
