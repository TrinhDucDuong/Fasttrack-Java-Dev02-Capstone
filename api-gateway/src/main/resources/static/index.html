<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10213a">
  <title>Middle Java Store</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231659a8'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3EMJ%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f3f6fb; --surface: #ffffff; --surface-2: #f7f9fc; --border: #dce4ef;
      --text: #14243a; --muted: #5d6e84; --accent: #1659a8; --accent-ink: #ffffff;
      --ok: #168454; --ok-bg: #e8f5ee; --warn: #9a5b00; --warn-bg: #fff4e0;
      --danger: #b42318; --danger-bg: #fdecea; --admin: #6b3fb0; --admin-bg: #f1ebfb;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0d1726; --surface: #13213a; --surface-2: #182a47; --border: #263b5c;
        --text: #e6edf7; --muted: #9db0c9; --accent: #5aa2ff; --accent-ink: #0d1726;
        --ok: #4cc38a; --ok-bg: #12352a; --warn: #f5b454; --warn-bg: #3a2c12;
        --danger: #ff8a80; --danger-bg: #3d1c1c; --admin: #b794f6; --admin-bg: #2c2147;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
    .brand { font-weight: 800; font-size: 1.1rem; margin-right: auto; display: flex; align-items: center; gap: 10px; }
    .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: .8rem; }
    .health { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: .85rem; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #91a0b3; }
    .dot.up { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 20%, transparent); }
    .who { display: flex; align-items: center; gap: 8px; font-size: .9rem; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: .75rem; font-weight: 700; letter-spacing: .03em; }
    .badge.CUSTOMER { background: var(--ok-bg); color: var(--ok); }
    .badge.ADMIN { background: var(--admin-bg); color: var(--admin); }
    .badge.PAID, .badge.CONFIRMED, .badge.active { background: var(--ok-bg); color: var(--ok); }
    .badge.PENDING, .badge.AWAITING_PAYMENT { background: var(--warn-bg); color: var(--warn); }
    .badge.inactive { background: var(--danger-bg); color: var(--danger); }
    main { width: min(1180px, 100%); margin: 0 auto; padding: 20px 16px 60px; }
    nav.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
    nav.tabs button { background: transparent; color: var(--muted); border: 1px solid transparent; }
    nav.tabs button.active { background: var(--surface); color: var(--text); border-color: var(--border); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; }
    .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
    .split { display: grid; gap: 16px; grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); align-items: start; }
    @media (max-width: 820px) { .split { grid-template-columns: 1fr; } }
    h2 { margin: 0 0 12px; font-size: 1.15rem; }
    h3 { margin: 0 0 6px; font-size: 1rem; }
    p.muted, .muted { color: var(--muted); }
    .price { font-weight: 800; font-size: 1.1rem; }
    button, .btn { font: inherit; font-weight: 650; cursor: pointer; border-radius: 9px; padding: 8px 14px;
      border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); }
    button.ghost { background: transparent; color: var(--accent); }
    button.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
    button.small { padding: 4px 10px; font-size: .85rem; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    input, select, textarea { font: inherit; width: 100%; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--border);
      background: var(--surface-2); color: var(--text); }
    label { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); font-weight: 600; }
    form.stack { display: grid; gap: 10px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .row > * { flex: 0 0 auto; }
    .grow { flex: 1 1 auto !important; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-weight: 650; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; }
    .table-wrap { overflow-x: auto; }
    .qty { width: 64px; }
    .total { display: flex; justify-content: space-between; font-size: 1.1rem; font-weight: 800; margin: 12px 0; }
    .auth { width: min(420px, 100%); margin: 40px auto; }
    .auth nav { display: flex; gap: 6px; margin-bottom: 14px; }
    .note { padding: 10px 12px; border-radius: 10px; background: var(--surface-2); color: var(--muted); font-size: .85rem; }
    .video { aspect-ratio: 16 / 9; width: 100%; border: 0; border-radius: 10px; background: #000; }
    #toast { position: fixed; right: 16px; bottom: 16px; max-width: min(420px, calc(100% - 32px)); padding: 12px 16px; border-radius: 12px;
      background: var(--text); color: var(--bg); box-shadow: 0 10px 30px #0004; opacity: 0; transform: translateY(10px); transition: .2s; pointer-events: none; }
    #toast.show { opacity: 1; transform: none; }
    #toast.error { background: var(--danger); color: #fff; }
    .hidden { display: none !important; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .85rem; }
    .empty { padding: 18px; text-align: center; color: var(--muted); }
    .list { display: grid; gap: 8px; }
    .list-item { padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); }
  </style>
</head>
<body>
<header>
  <div class="brand"><span class="logo">MJ</span>Middle Java Store</div>
  <span class="health" title="Gateway health"><span class="dot" id="health-dot"></span><span id="health-text">Đang kiểm tra</span></span>
  <div class="who hidden" id="who">
    <span id="who-email"></span><span class="badge" id="who-role"></span>
    <button class="ghost small" id="logout">Đăng xuất</button>
  </div>
</header>

<main>
  <!-- Login / register -->
  <section id="auth-view" class="auth card">
    <nav>
      <button type="button" id="tab-login" class="small">Đăng nhập</button>
      <button type="button" id="tab-register" class="ghost small">Đăng ký</button>
    </nav>
    <form class="stack" id="auth-form">
      <h2 id="auth-title">Đăng nhập</h2>
      <label>Email <input name="email" type="email" autocomplete="username" required></label>
      <label>Mật khẩu <input name="password" type="password" autocomplete="current-password" minlength="8" required></label>
      <button type="submit" id="auth-submit">Đăng nhập</button>
      <p class="note">Tài khoản mới đăng ký có role <b>CUSTOMER</b>. Tài khoản <b>ADMIN</b> được tạo sẵn khi hệ thống khởi động.</p>
    </form>
  </section>

  <!-- Customer -->
  <section id="customer-view" class="hidden">
    <nav class="tabs" data-tabs="customer">
      <button data-tab="shop" class="active">Cửa hàng</button>
      <button data-tab="orders">Đơn hàng</button>
      <button data-tab="notifications">Thông báo</button>
    </nav>
    <div data-panel="shop" class="split">
      <div>
        <form class="row" id="search-form" style="margin-bottom:14px">
          <input class="grow" name="q" placeholder="Tìm khóa học theo tên (ví dụ: Java)" aria-label="Tìm khóa học">
          <button type="submit">Tìm</button>
        </form>
        <div class="grid" id="catalog"></div>
      </div>
      <aside class="card" id="cart-card">
        <h2>Giỏ hàng</h2>
        <div id="cart-items"></div>
        <div class="total"><span>Tổng</span><span id="cart-total">0</span></div>
        <label>Phương thức thanh toán
          <select id="payment-method"></select>
        </label>
        <p class="muted" id="payment-hint" style="font-size:.85rem"></p>
        <button id="checkout" style="width:100%">Đặt hàng</button>
      </aside>
    </div>
    <div data-panel="orders" class="hidden">
      <div class="split">
        <div class="card"><h2>Đơn hàng của tôi</h2><div class="table-wrap" id="orders"></div></div>
        <div class="card"><h2>Khóa học đã mua</h2><div id="player" class="muted">Chọn “Xem video” ở một đơn đã thanh toán.</div></div>
      </div>
    </div>
    <div data-panel="notifications" class="hidden card">
      <div class="row" style="justify-content:space-between"><h2>Thông báo</h2><button class="ghost small" id="reload-notifications">Tải lại</button></div>
      <div class="list" id="notifications"></div>
    </div>
  </section>

  <!-- Admin -->
  <section id="admin-view" class="hidden">
    <nav class="tabs" data-tabs="admin">
      <button data-tab="admin-orders" class="active">Quản lý đơn hàng</button>
      <button data-tab="admin-products">Quản lý sản phẩm</button>
    </nav>
    <div data-panel="admin-orders" class="card">
      <div class="row" style="justify-content:space-between"><h2>Tất cả đơn hàng</h2><button class="ghost small" id="reload-admin-orders">Tải lại</button></div>
      <div class="table-wrap" id="admin-orders"></div>
    </div>
    <div data-panel="admin-products" class="hidden split">
      <div class="card"><h2>Sản phẩm</h2><div class="table-wrap" id="admin-products"></div></div>
      <form class="card stack" id="product-form">
        <h2 id="product-form-title">Thêm khóa học</h2>
        <input type="hidden" name="id">
        <label>Slug <input name="slug" pattern="[a-z0-9-]{3,100}" placeholder="vi-du-khoa-hoc" required></label>
        <label>Tên khóa học <input name="title" required></label>
        <label>Mô tả <textarea name="description" rows="3" required></textarea></label>
        <label>Giá (USD) <input name="price" type="number" step="0.01" min="0" required></label>
        <label>Link YouTube <input name="youtubeUrl" placeholder="https://www.youtube.com/watch?v=..." required></label>
        <div class="row"><button type="submit" id="product-submit">Lưu</button><button type="button" class="ghost" id="product-reset">Làm mới</button></div>
      </form>
    </div>
  </section>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';
  const $ = (selector) => document.querySelector(selector);
  const money = (value) => '$' + Number(value || 0).toFixed(2);
  const when = (iso) => iso ? new Date(iso).toLocaleString('vi-VN') : '';
  const PAYMENT_HINTS = {
    VNPAY: 'VNPay (giả lập): thanh toán ngay, mở khóa học tức thì.',
    COD: 'COD: thanh toán sau, chờ ADMIN xác nhận đã nhận tiền.',
    BANK_TRANSFER: 'Chuyển khoản: nhận mã nội dung chuyển khoản, chờ ADMIN xác nhận.'
  };

  // ---------- tiny DOM helper (textContent only, never innerHTML with data) ----------
  function h(tag, attrs, ...children) {
    const el = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([key, value]) => {
      if (value === undefined || value === null || value === false) return;
      if (key.startsWith('on')) el.addEventListener(key.slice(2), value);
      else if (key === 'class') el.className = value;
      else el.setAttribute(key, value === true ? '' : value);
    });
    children.flat().forEach(child => {
      if (child === null || child === undefined || child === false) return;
      el.append(child instanceof Node ? child : document.createTextNode(String(child)));
    });
    return el;
  }
  const badge = (text, cls) => h('span', { class: 'badge ' + (cls || text) }, text);

  let toastTimer;
  function toast(message, isError) {
    const el = $('#toast');
    el.textContent = message;
    el.classList.toggle('error', !!isError);
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
  }

  // ---------- session ----------
  const store = {
    get() { try { return JSON.parse(localStorage.getItem('mj-session') || 'null'); } catch { return null; } },
    set(value) { try { value ? localStorage.setItem('mj-session', JSON.stringify(value)) : localStorage.removeItem('mj-session'); } catch { /* storage unavailable */ } }
  };
  let session = store.get();

  function decode(token) {
    try {
      const payload = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      const json = decodeURIComponent(atob(payload).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
      return JSON.parse(json);
    } catch { return {}; }
  }
  function saveTokens(auth) {
    const claims = decode(auth.accessToken);
    const roles = claims.roles || [];
    session = { accessToken: auth.accessToken, refreshToken: auth.refreshToken, email: claims.email,
      role: roles.includes('ROLE_ADMIN') ? 'ADMIN' : 'CUSTOMER' };
    store.set(session);
  }

  async function api(path, options = {}, retried = false) {
    const headers = { Accept: 'application/json', ...(options.body ? { 'Content-Type': 'application/json' } : {}) };
    if (session?.accessToken) headers.Authorization = 'Bearer ' + session.accessToken;
    const response = await fetch(path, { ...options, headers, body: options.body ? JSON.stringify(options.body) : undefined });
    if (response.status === 401 && session?.refreshToken && !retried) {
      const refreshed = await fetch('/api/auth/refresh', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ refreshToken: session.refreshToken }) });
      if (refreshed.ok) { saveTokens(await refreshed.json()); return api(path, options, true); }
      logout('Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại.');
      throw new Error('Unauthorized');
    }
    const text = await response.text();
    const data = text ? JSON.parse(text) : null;
    if (!response.ok) {
      const message = data?.detail || data?.message || data?.error || ('HTTP ' + response.status);
      const error = new Error(response.status === 403 ? 'Không có quyền (403): ' + message : message);
      error.status = response.status;
      throw error;
    }
    return data;
  }
  const run = (fn) => (...args) => Promise.resolve(fn(...args)).catch(error => { if (error.message !== 'Unauthorized') toast(error.message, true); });

  // ---------- health ----------
  fetch('/actuator/health').then(r => r.json()).then(data => {
    $('#health-dot').classList.toggle('up', data.status === 'UP');
    $('#health-text').textContent = data.status === 'UP' ? 'Hệ thống hoạt động' : data.status;
  }).catch(() => { $('#health-text').textContent = 'Không kết nối được'; });

  // ---------- auth view ----------
  let mode = 'login';
  function setMode(next) {
    mode = next;
    $('#tab-login').classList.toggle('ghost', mode !== 'login');
    $('#tab-register').classList.toggle('ghost', mode !== 'register');
    $('#auth-title').textContent = mode === 'login' ? 'Đăng nhập' : 'Đăng ký tài khoản khách hàng';
    $('#auth-submit').textContent = mode === 'login' ? 'Đăng nhập' : 'Đăng ký';
    $('#auth-form').password.autocomplete = mode === 'login' ? 'current-password' : 'new-password';
  }
  $('#tab-login').addEventListener('click', () => setMode('login'));
  $('#tab-register').addEventListener('click', () => setMode('register'));
  $('#auth-form').addEventListener('submit', run(async (event) => {
    event.preventDefault();
    const form = event.target;
    const body = { email: form.email.value.trim(), password: form.password.value };
    const auth = await api('/api/auth/' + (mode === 'login' ? 'login' : 'register'), { method: 'POST', body });
    saveTokens(auth);
    form.reset();
    toast(mode === 'login' ? 'Đăng nhập thành công' : 'Đăng ký thành công');
    render();
  }));
  function logout(message) {
    const refreshToken = session?.refreshToken;
    session = null;
    store.set(null);
    if (refreshToken) fetch('/api/auth/logout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ refreshToken }) }).catch(() => {});
    render();
    if (message) toast(message, true);
  }
  $('#logout').addEventListener('click', () => logout());

  // ---------- tabs ----------
  document.querySelectorAll('nav.tabs').forEach(nav => {
    nav.addEventListener('click', (event) => {
      const button = event.target.closest('button[data-tab]');
      if (!button) return;
      nav.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === button));
      const section = nav.parentElement;
      section.querySelectorAll('[data-panel]').forEach(panel => panel.classList.toggle('hidden', panel.dataset.panel !== button.dataset.tab));
      loaders[button.dataset.tab]?.();
    });
  });

  // ---------- customer ----------
  const loadCatalog = run(async (query) => {
    const courses = await api('/api/courses' + (query ? '?search=' + encodeURIComponent(query) : ''));
    const box = $('#catalog');
    box.replaceChildren(...(courses.length ? courses.map(course => h('article', { class: 'card', 'data-course': course.id },
      h('h3', {}, course.title),
      h('p', { class: 'muted' }, course.description),
      h('div', { class: 'row', style: 'justify-content:space-between' },
        h('span', { class: 'price' }, money(course.price)),
        h('button', { class: 'small', onclick: run(async () => {
          renderCart(await api('/api/cart/items', { method: 'POST', body: { courseId: course.id, quantity: 1 } }));
          toast('Đã thêm “' + course.title + '” vào giỏ');
        }) }, 'Thêm vào giỏ'))
    )) : [h('div', { class: 'empty card' }, 'Không tìm thấy khóa học phù hợp')]));
  });
  $('#search-form').addEventListener('submit', (event) => { event.preventDefault(); loadCatalog(event.target.q.value.trim()); });

  function renderCart(cart) {
    const box = $('#cart-items');
    box.replaceChildren(...(cart.items.length ? cart.items.map(item => h('div', { class: 'list-item', 'data-cart-item': item.courseId },
      h('div', { class: 'row', style: 'justify-content:space-between' }, h('b', {}, item.title), h('span', {}, money(item.lineTotal))),
      h('div', { class: 'row', style: 'margin-top:6px' },
        h('span', { class: 'muted' }, money(item.unitPrice) + ' ×'),
        h('input', { class: 'qty', type: 'number', min: '1', value: item.quantity, 'aria-label': 'Số lượng',
          onchange: run(async (event) => renderCart(await api('/api/cart/items/' + item.courseId, { method: 'PUT', body: { quantity: Number(event.target.value) } }))) }),
        h('button', { class: 'danger small', onclick: run(async () => {
          await api('/api/cart/items/' + item.courseId, { method: 'DELETE' });
          renderCart(await api('/api/cart'));
          toast('Đã xóa khỏi giỏ');
        }) }, 'Xóa'))
    )) : [h('div', { class: 'empty' }, 'Giỏ hàng trống')]));
    $('#cart-total').textContent = money(cart.total);
    $('#checkout').disabled = !cart.items.length;
  }
  const loadCart = run(async () => renderCart(await api('/api/cart')));

  const loadPaymentMethods = run(async () => {
    const methods = await api('/api/orders/payment-methods');
    const select = $('#payment-method');
    const order = ['VNPAY', 'COD', 'BANK_TRANSFER'];
    methods.sort((a, b) => (order.indexOf(a) + 1 || 99) - (order.indexOf(b) + 1 || 99));
    select.replaceChildren(...methods.map(method => h('option', { value: method }, method)));
    select.onchange = () => { $('#payment-hint').textContent = PAYMENT_HINTS[select.value] || ''; };
    select.onchange();
  });
  $('#checkout').addEventListener('click', run(async () => {
    const order = await api('/api/orders', { method: 'POST', body: { paymentMethod: $('#payment-method').value } });
    toast('Đặt hàng thành công: đơn #' + order.id + ' – ' + order.paymentStatus);
    loadCart();
  }));

  const loadOrders = run(async () => {
    const orders = await api('/api/orders');
    $('#orders').replaceChildren(orders.length ? h('table', {},
      h('thead', {}, h('tr', {}, ['Mã', 'Khóa học', 'Tổng', 'Thanh toán', 'Trạng thái', ''].map(t => h('th', {}, t)))),
      h('tbody', {}, orders.map(order => h('tr', { 'data-order': order.id },
        h('td', { class: 'mono' }, '#' + order.id, h('div', { class: 'muted' }, when(order.createdAt))),
        h('td', {}, order.items.map(i => h('div', {}, i.courseTitle + ' × ' + i.quantity))),
        h('td', {}, money(order.total)),
        h('td', {}, order.paymentMethod, h('br'), badge(order.paymentStatus), order.paymentReference ? h('div', { class: 'mono muted' }, order.paymentReference) : null),
        h('td', {}, badge(order.status)),
        h('td', {}, order.paymentStatus === 'PAID' ? order.items.map(i => h('button', { class: 'ghost small', onclick: run(() => showVideo(i.courseId)) }, 'Xem video')) : h('span', { class: 'muted' }, 'Chờ thanh toán'))
      )))) : h('div', { class: 'empty' }, 'Chưa có đơn hàng'));
  });
  async function showVideo(courseId) {
    const video = await api('/api/courses/' + courseId + '/video');
    $('#player').replaceChildren(h('h3', {}, video.title),
      h('iframe', { class: 'video', src: video.youtubeEmbedUrl, title: video.title, allow: 'accelerometer; encrypted-media; picture-in-picture', allowfullscreen: true }));
  }

  const loadNotifications = run(async () => {
    const items = await api('/api/notifications');
    $('#notifications').replaceChildren(...(items.length ? items.map(n => h('div', { class: 'list-item' },
      h('div', {}, n.message), h('div', { class: 'muted', style: 'font-size:.8rem' }, 'Đơn #' + n.orderId + ' · ' + when(n.createdAt))))
      : [h('div', { class: 'empty' }, 'Chưa có thông báo')]));
  });
  $('#reload-notifications').addEventListener('click', loadNotifications);

  // ---------- admin ----------
  const loadAdminOrders = run(async () => {
    const orders = await api('/api/admin/orders');
    $('#admin-orders').replaceChildren(orders.length ? h('table', {},
      h('thead', {}, h('tr', {}, ['Mã', 'User', 'Khóa học', 'Tổng', 'Thanh toán', 'Trạng thái', ''].map(t => h('th', {}, t)))),
      h('tbody', {}, orders.map(order => h('tr', { 'data-admin-order': order.id },
        h('td', { class: 'mono' }, '#' + order.id, h('div', { class: 'muted' }, when(order.createdAt))),
        h('td', { class: 'mono' }, order.userId),
        h('td', {}, order.items.map(i => h('div', {}, i.courseTitle + ' × ' + i.quantity))),
        h('td', {}, money(order.total)),
        h('td', {}, order.paymentMethod, h('br'), badge(order.paymentStatus), order.paymentReference ? h('div', { class: 'mono muted' }, order.paymentReference) : null),
        h('td', {}, badge(order.status)),
        h('td', {}, order.paymentStatus === 'PENDING' ? h('button', { class: 'small', onclick: run(async () => {
          await api('/api/admin/orders/' + order.id + '/confirm-payment', { method: 'PUT' });
          toast('Đã xác nhận thanh toán đơn #' + order.id);
          loadAdminOrders();
        }) }, 'Xác nhận đã thanh toán') : null)
      )))) : h('div', { class: 'empty' }, 'Chưa có đơn hàng'));
  });
  $('#reload-admin-orders').addEventListener('click', loadAdminOrders);

  const loadAdminProducts = run(async () => {
    const courses = await api('/api/admin/courses');
    $('#admin-products').replaceChildren(h('table', {},
      h('thead', {}, h('tr', {}, ['ID', 'Khóa học', 'Giá', 'Trạng thái', ''].map(t => h('th', {}, t)))),
      h('tbody', {}, courses.map(course => h('tr', { 'data-admin-course': course.id },
        h('td', { class: 'mono' }, course.id),
        h('td', {}, h('b', {}, course.title), h('div', { class: 'muted mono' }, course.slug)),
        h('td', {}, money(course.price)),
        h('td', {}, course.active ? badge('Đang bán', 'active') : badge('Ngừng bán', 'inactive')),
        h('td', { class: 'row' },
          h('button', { class: 'ghost small', onclick: () => editProduct(course) }, 'Sửa'),
          course.active ? h('button', { class: 'danger small', onclick: run(async () => {
            if (!confirm('Ngừng bán “' + course.title + '”?')) return;
            await api('/api/admin/courses/' + course.id, { method: 'DELETE' });
            toast('Đã ngừng bán khóa học');
            loadAdminProducts();
          }) }, 'Ngừng bán') : null)
      )))));
  });
  function editProduct(course) {
    const form = $('#product-form');
    ['id', 'slug', 'title', 'description', 'price', 'youtubeUrl'].forEach(key => { form[key].value = course[key] ?? ''; });
    form.slug.readOnly = true;
    $('#product-form-title').textContent = 'Sửa khóa học #' + course.id;
    form.scrollIntoView({ behavior: 'smooth' });
  }
  function resetProductForm() {
    const form = $('#product-form');
    form.reset();
    form.id.value = '';
    form.slug.readOnly = false;
    $('#product-form-title').textContent = 'Thêm khóa học';
  }
  $('#product-reset').addEventListener('click', resetProductForm);
  $('#product-form').addEventListener('submit', run(async (event) => {
    event.preventDefault();
    const form = event.target;
    const body = { slug: form.slug.value.trim(), title: form.title.value.trim(), description: form.description.value.trim(),
      price: Number(form.price.value), youtubeUrl: form.youtubeUrl.value.trim() };
    const id = form.id.value;
    await api('/api/admin/courses' + (id ? '/' + id : ''), { method: id ? 'PUT' : 'POST', body });
    toast(id ? 'Đã cập nhật khóa học' : 'Đã thêm khóa học');
    resetProductForm();
    loadAdminProducts();
  }));

  const loaders = {
    shop: () => { loadCatalog(); loadCart(); },
    orders: loadOrders,
    notifications: loadNotifications,
    'admin-orders': loadAdminOrders,
    'admin-products': loadAdminProducts
  };

  // ---------- render ----------
  function render() {
    const loggedIn = !!session?.accessToken;
    $('#auth-view').classList.toggle('hidden', loggedIn);
    $('#who').classList.toggle('hidden', !loggedIn);
    $('#customer-view').classList.toggle('hidden', !loggedIn || session.role !== 'CUSTOMER');
    $('#admin-view').classList.toggle('hidden', !loggedIn || session.role !== 'ADMIN');
    if (!loggedIn) return;
    $('#who-email').textContent = session.email || '';
    const role = $('#who-role');
    role.textContent = session.role;
    role.className = 'badge ' + session.role;
    if (session.role === 'ADMIN') {
      loadAdminOrders();
    } else {
      loadPaymentMethods();
      loaders.shop();
    }
  }
  setMode('login');
  render();
})();
</script>
</body>
</html>
