services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: study_coach
      POSTGRES_USER: study_coach
      POSTGRES_PASSWORD: study_coach
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study_coach -d study_coach"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - study-coach-postgres:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: study_coach
      RABBITMQ_DEFAULT_PASS: study_coach
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  prometheus:
    image: prom/prometheus:latest
    profiles: [observability]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

volumes:
  study-coach-postgres:
