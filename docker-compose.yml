services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: study_coach
      POSTGRES_USER: study_coach
      POSTGRES_PASSWORD: study_coach
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study_coach -d study_coach"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - study-coach-postgres:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: study_coach
      RABBITMQ_DEFAULT_PASS: study_coach
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  video-storage:
    # S3-compatible object storage for course videos (same S3 API the app uses with Amazon S3 on AWS).
    image: chrislusf/seaweedfs:4.50
    command: ["server", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-dir=/data"]
    ports:
      - "8333:8333"
    volumes:
      - ./deploy/local/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
      - study-coach-videos:/data

  prometheus:
    image: prom/prometheus:latest
    profiles: [observability]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

volumes:
  study-coach-postgres:
  study-coach-videos:
