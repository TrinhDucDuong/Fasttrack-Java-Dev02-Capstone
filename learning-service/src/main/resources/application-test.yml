spring:
  datasource:
    url: jdbc:h2:mem:learning;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: PUBLIC
        cache:
          use_second_level_cache: false
  flyway:
    enabled: false
  cloud:
    discovery:
      enabled: false
eureka:
  client:
    enabled: false
